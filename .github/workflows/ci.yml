name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-tooling:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: python3 assets/icons/generate.py --check

  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked --workspace
      - run: cargo +stable check --locked --workspace
      - run: cargo +stable doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo +stable run --locked -p tervix -- --layout-demo

  msrv:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --locked --workspace --all-targets
      - run: cargo +1.89.0 test --locked --workspace

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v (for example 0.2.0 or 0.2.0-rc.1)
        required: true
        type: string

concurrency:
  group: tervix-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require a dispatch from main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Select main when starting a release." >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare cached Linux release image
        timeout-minutes: 15
        run: bash scripts/prepare_runner.sh release
      - name: Prepare version and tag the selected main commit
        shell: bash scripts/runner_shell.sh {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/prepare_release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --apply
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "$tag already identifies a different commit." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Build and package Linux x86-64
        shell: bash scripts/runner_shell.sh {0}
        run: |
          export RUSTUP_TOOLCHAIN="$RUST_VERSION"
          cargo build --release --locked -p tervix
          target/release/tervix --layout-demo
          bash scripts/package_linux.sh target/release/tervix "$RELEASE_VERSION"
      - name: Publish the verified assets
        shell: bash scripts/runner_shell.sh {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "$tag already has a published release." >&2
              exit 1
            fi
          else
            args=(--draft --verify-tag --title "Tervix $tag" --notes-file CHANGELOG.md)
            if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$tag" "${args[@]}"
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false

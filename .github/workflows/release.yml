name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version without v (for example 0.2.0 or 0.2.0-rc.1)
        required: true
        type: string
      prerelease:
        description: Mark as preview (automatic for versions with a suffix)
        default: true
        type: boolean

      publish:
        description: Create a GitHub Release after verifying both packages
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/prepare_release.py --version "$env:RELEASE_VERSION" --commit "$env:RELEASE_SHA" --apply
      - run: rustup target add "$env:RELEASE_TARGET"
      - run: cargo fetch --locked
      - run: cargo build --release --locked -p tervix --target "$env:RELEASE_TARGET"
      - run: python scripts/package_release.py --version "$env:RELEASE_VERSION" --commit "$env:RELEASE_SHA" --target "$env:RELEASE_TARGET" --exe "target/$env:RELEASE_TARGET/release/tervix.exe" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: python3 scripts/verify_release.py --version "$RELEASE_VERSION" --directory dist
      - run: python3 scripts/prepare_release.py --version "$RELEASE_VERSION" --commit "$RELEASE_SHA" > dist/CHANGELOG.md
      - name: Publish GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Refusing to overwrite existing tag $tag" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          args=(release create "$tag" --target "$RELEASE_SHA" --title "Tervix $tag" --notes-file dist/CHANGELOG.md)
          if [ "$RELEASE_PRERELEASE" = true ] || [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}" dist/*

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version without v (for example 0.2.0 or 0.2.0-rc.1)
        required: true
        type: string
      prerelease:
        description: Mark as preview (automatic for versions with a suffix)
        default: true
        type: boolean

      publish:
        description: Create a GitHub Release after building all executables
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    container: rust:bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux and Windows build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang lld llvm libxkbcommon-dev pkg-config python3
          bash scripts/setup_xwin.sh
      - run: python3 scripts/prepare_release.py --version "$RELEASE_VERSION" --commit "$RELEASE_SHA" --apply
      - name: Build release executables
        run: |
          name="tervix-v$RELEASE_VERSION"
          mkdir -p dist
          cargo build --release --locked -p tervix --target x86_64-unknown-linux-gnu
          install -m 755 target/x86_64-unknown-linux-gnu/release/tervix "dist/$name-linux-x86_64"
          "dist/$name-linux-x86_64" --layout-demo
          for arch in x86_64 aarch64; do
            target="$arch-pc-windows-msvc"
            exe="target/$target/release/tervix.exe"
            cargo xwin build --release --locked -p tervix --target "$target"
            cp "$exe" "dist/$name-$target.exe"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git gh python3
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify the release executables
        run: |
          name="tervix-v$RELEASE_VERSION"
          test -s "dist/$name-linux-x86_64"
          for arch in x86_64 aarch64; do
            test -s "dist/$name-$arch-pc-windows-msvc.exe"
          done
      - name: Publish GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Refusing to overwrite existing tag $tag" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          python3 scripts/prepare_release.py --version "$RELEASE_VERSION" --commit "$RELEASE_SHA" > CHANGELOG.md
          args=(release create "$tag" --target "$RELEASE_SHA" --title "Tervix $tag" --notes-file CHANGELOG.md)
          if [ "$RELEASE_PRERELEASE" = true ] || [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}" dist/*

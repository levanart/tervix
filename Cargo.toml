[workspace]
members = ["apps/tervix", "crates/tervix-core", "crates/tervix-application", "crates/tervix-ui", "crates/tervix-terminal", "crates/tervix-system", "crates/tervix-platform-windows", "crates/tervix-docker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
tervix-core = { version = "0.1.0", path = "crates/tervix-core" }
tervix-application = { version = "0.1.0", path = "crates/tervix-application" }
tervix-ui = { version = "0.1.0", path = "crates/tervix-ui" }
tervix-terminal = { version = "0.1.0", path = "crates/tervix-terminal" }
tervix-system = { version = "0.1.0", path = "crates/tervix-system" }
tervix-docker = { version = "0.1.0", path = "crates/tervix-docker" }
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
portable-pty = "=0.9.0"
alacritty_terminal = { version = "=0.25.1", default-features = false }
iced = { version = "=0.13.1", default-features = false, features = ["wgpu", "fira-sans"] }
thiserror = "2.0.21"
uuid = { version = "1.29.1", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
